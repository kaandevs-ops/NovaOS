# NovaOS Stage-4C boot-state journal record example.
# Two checksum-protected records provide corruption/power-loss resilience.
# The journal itself remains mutable/untrusted for age authorization: Stage-4C
# enforces signed per-System rollback_index against TPM NV counter 0x01504e56.
format=3
record_seq=2
active=A
previous=A
generation=0
confirmed=yes
attempts_left=0
pending_kind=none
update_id=none
checksum=<generated-at-build-time>
