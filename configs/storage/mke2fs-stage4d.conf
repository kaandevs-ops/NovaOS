# NovaOS Stage-4D deterministic ext4 image profile.
#
# This file intentionally replaces the host /etc/mke2fs.conf for NovaOS
# dm-verity payload construction.  Host distribution defaults must not change
# the authenticated bytes or dm-verity root hash of a NovaOS System/Recovery
# image.
[defaults]
base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
blocksize = 4096
inode_size = 256
inode_ratio = 16384
reserved_ratio = 0
enable_periodic_fsck = 0
lazy_itable_init = false

[fs_types]
ext4 = {
    features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
}

# mke2fs automatically adds the "small" usage type for compact images.
# Define it explicitly so the NovaOS-owned profile is complete and does not
# fall back to or warn about host configuration.  Keep the same Stage-4D
# geometry rather than changing the on-disk format based on image size.
small = {
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
}
